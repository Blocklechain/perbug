name: Wallets

# Builds the Perbug Qt wallet for macOS (Apple Silicon), Windows and Linux,
# and attaches the archives to a GitHub Release.
#
# macOS is built on GitHub's macos-14 runners because they are Apple Silicon.
# Cross-compiling a macOS binary from Linux is not a licensing option, and an
# Intel build is deliberately not produced — this ships arm64 only.
#
# Trigger: push a tag like v30.2.0, or run it by hand.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v30.2.0)'
        required: false

permissions:
  contents: write

env:
  BUILD_TYPE: Release

jobs:
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-14          # arm64. Do NOT change to macos-13 (Intel).
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          # The runner ships openssl@1.1, which owns the bin/openssl symlink.
          # python@3.14 comes in as a transitive dep and pulls openssl@3, whose
          # keg-link then collides with openssl@1.1 and makes `brew install`
          # exit non-zero — failing the whole job even though every formula we
          # actually compile against built fine. We never link against openssl,
          # so free that symlink first and treat the install's exit code as
          # advisory, then hard-fail only if a dependency we need is missing.
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_CURL_RETRIES=5
          brew unlink openssl@1.1 2>/dev/null || true
          # Install the full `qt` formula. Splitting it into qtbase/qttools
          # kegs breaks Qt6's component discovery — find_package(Qt6 COMPONENTS
          # LinguistTools) only searches siblings of the qtbase Qt6Config, so
          # a separate qttools keg is invisible and qt6_add_lrelease fails at
          # configure. The metapackage unifies the cmake packages.
          #
          # qt pulls a few deps that build from source and fetch tarballs from
          # ftp.gnu.org (coreutils, automake), which intermittently times out
          # from the macOS runners. brew is idempotent, so retry the whole
          # install a few times — each pass resumes from what already landed —
          # and let Homebrew retry each download before giving up.
          for attempt in 1 2 3 4 5; do
            brew install cmake boost@1.85 libevent qt qrencode zeromq sqlite pkgconf && break
            echo "brew install attempt $attempt failed (likely a transient ftp.gnu.org timeout); retrying in 30s…"
            sleep 30
          done
          brew link --overwrite --force qt boost@1.85 2>/dev/null || true
          for f in cmake boost@1.85 libevent qt qrencode zeromq sqlite pkgconf; do
            brew --prefix "$f" >/dev/null 2>&1 || { echo "MISSING dependency: $f"; exit 1; }
          done

      - name: Configure
        run: |
          # Translations ship in the qttranslations keg, NOT under the qt
          # prefix, so resolve QT_TRANSLATIONS_DIR explicitly or macdeployqtplus
          # aborts the `deploy` target with "Could not find translation dir".
          TRANSLATIONS=""
          for c in "$(brew --prefix qttranslations 2>/dev/null)/share/qt/translations" \
                   "$(brew --prefix qt 2>/dev/null)/share/qt/translations" \
                   "/opt/homebrew/share/qt/translations"; do
            [ -d "$c" ] && { TRANSLATIONS="$c"; break; }
          done
          test -n "$TRANSLATIONS" || { echo "cannot locate Qt translations dir"; exit 1; }
          echo "QT_TRANSLATIONS_DIR=$TRANSLATIONS"
          cmake -B build \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DBUILD_GUI=ON \
            -DENABLE_WALLET=ON \
            -DBUILD_TESTS=OFF \
            -DBUILD_TX=ON \
            -DBUILD_UTIL=ON \
            -DBUILD_WALLET_TOOL=ON \
            -DENABLE_IPC=OFF \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt);$(brew --prefix boost@1.85)" \
            -DBoost_INCLUDE_DIR="$(brew --prefix boost@1.85)/include" \
            -DQT_TRANSLATIONS_DIR="$TRANSLATIONS" \
            -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.logicalcpu)"

      # Links against absolute Homebrew paths otherwise, so the GUI cannot
      # launch on a Mac without Homebrew. macdeployqtplus copies the Qt
      # frameworks into Perbug-Qt.app and rewrites the load commands.
      - name: Bundle app
        run: |
          # macdeployqtplus derives Qt's prefix from where the frameworks live
          # and only falls back to $QTDIR. Homebrew resolves the frameworks to
          # the qtbase keg, which has no share/qt/translations, so detection
          # fails, and the script then SKIPS PLUGIN DEPLOYMENT with only a
          # warning. The app builds green and dies at startup with
          # "no Qt platform plugin could be initialized".
          QTDIR=""
          for c in "$(brew --prefix qtbase 2>/dev/null)" \
                   "$(brew --prefix qt 2>/dev/null)"; do
            if [ -n "$c" ] && [ -f "$c/share/qt/plugins/platforms/libqcocoa.dylib" ]; then
              QTDIR="$c"; break
            fi
          done
          test -n "$QTDIR" || { echo "cannot locate Qt plugins under any brew prefix"; exit 1; }
          echo "QTDIR=$QTDIR"
          export QTDIR
          cmake --build build --target deploy
          ls -la build/*.zip

      - name: Package
        run: |
          VER="${GITHUB_REF_NAME:-dev}"
          OUT="perbug-qt-${VER}-macos-arm64"
          mkdir -p "dist/$OUT"
          # Copy the bundle straight out of the build tree. Round-tripping it
          # through unzip/zip flattens the framework symlinks (Versions/Current,
          # the top-level QtCore and Resources), and the code signature was
          # computed over the symlinked layout — so the flattened copy is
          # reported by macOS as "damaged and can't be opened".
          APP_SRC=$(find build -maxdepth 3 -name 'Perbug-Qt.app' -type d \
            -exec test -d '{}/Contents/Frameworks' \; -print | head -1)
          test -n "$APP_SRC" || { echo "no deployed .app bundle with Frameworks"; find build -maxdepth 3 -name '*.app'; exit 1; }
          echo "bundling $APP_SRC"
          cp -R "$APP_SRC" "dist/$OUT/"
          test -d "dist/$OUT/Perbug-Qt.app" || { echo "deploy produced no .app bundle"; exit 1; }
          test -L "dist/$OUT/Perbug-Qt.app/Contents/Frameworks/QtCore.framework/Versions/Current" \
            || { echo "framework symlinks did not survive the copy"; exit 1; }
          # The signature must still validate after packaging, or users get
          # "damaged" on first launch.
          # Without the cocoa platform plugin the GUI aborts on launch.
          test -f "dist/$OUT/Perbug-Qt.app/Contents/PlugIns/platforms/libqcocoa.dylib" || {
            echo "MISSING Qt cocoa platform plugin - the GUI would abort at startup"
            find "dist/$OUT/Perbug-Qt.app/Contents" -maxdepth 2; exit 1; }
          codesign --verify --deep --strict --verbose=2 "dist/$OUT/Perbug-Qt.app" \
            || { echo "BROKEN app signature"; exit 1; }
          # The command-line tools people expect alongside it.
          for b in perbug perbugd perbug-cli perbug-tx perbug-util perbug-wallet; do
            find build/bin build/src -name "$b" -type f -perm +111 -exec cp {} "dist/$OUT/" \; 2>/dev/null || true
          done
          # Same relocation problem as the GUI: copy every non-system dylib in
          # beside the tools and repoint the load commands at it.
          mkdir -p "dist/$OUT/lib"
          for pass in 1 2 3; do
            for f in "dist/$OUT"/* "dist/$OUT"/lib/*; do
              [ -f "$f" ] || continue
              file -b "$f" | grep -q Mach-O || continue
              otool -L "$f" | tail -n +2 | awk '{print $1}' | while read -r dep; do
                case "$dep" in
                  /opt/homebrew/*|/usr/local/*) ;;
                  *) continue ;;
                esac
                base=$(basename "$dep")
                [ -f "dist/$OUT/lib/$base" ] || { cp -L "$dep" "dist/$OUT/lib/$base"; chmod u+w "dist/$OUT/lib/$base"; }
                case "$f" in
                  */lib/*) install_name_tool -change "$dep" "@loader_path/$base" "$f" ;;
                  *)       install_name_tool -change "$dep" "@executable_path/lib/$base" "$f" ;;
                esac
              done
            done
          done
          for f in "dist/$OUT"/lib/*.dylib; do
            [ -f "$f" ] && install_name_tool -id "@loader_path/$(basename "$f")" "$f"
          done
          # arm64 requires a valid signature and install_name_tool broke it.
          for f in "dist/$OUT"/lib/*.dylib "dist/$OUT"/perbug*; do
            [ -f "$f" ] && codesign --force --sign - --timestamp=none "$f" 2>/dev/null || true
          done
          for b in perbug perbugd perbug-cli perbug-tx perbug-util perbug-wallet; do
            codesign --verify "dist/$OUT/$b" || { echo "BROKEN SIGNATURE: $b"; exit 1; }
          done
          # Nothing may still point outside the archive.
          for b in perbug perbugd perbug-cli perbug-tx perbug-util perbug-wallet; do
            if otool -L "dist/$OUT/$b" | tail -n +2 | grep -qE '^\s+(/opt/homebrew|/usr/local)'; then
              echo "UNBUNDLED DEPENDENCY in $b:"; otool -L "dist/$OUT/$b"; exit 1
            fi
          done
          cp COPYING README.md "dist/$OUT/" 2>/dev/null || true
          ls -la "dist/$OUT"
          # A silent partial build must not ship as a release archive.
          for b in perbug perbugd perbug-cli perbug-tx perbug-util perbug-wallet; do
            ls "dist/$OUT/$b" >/dev/null 2>&1 || { echo "MISSING BINARY: $b"; exit 1; }
          done
          cd dist && ditto -c -k --sequesterRsrc --keepParent "$OUT" "${OUT}.zip"

      # Every packaging bug so far (missing frameworks, a signature broken by
      # install_name_tool, a flattened bundle, a missing cocoa plugin) produced
      # a green build and an app that died on launch. Actually run them.
      - name: Smoke test
        run: |
          VER="${GITHUB_REF_NAME:-dev}"
          OUT="dist/perbug-qt-${VER}-macos-arm64"
          "$OUT/perbugd" --version
          "$OUT/perbug-cli" --version
          "$OUT/perbug-wallet" --version
          "$OUT/Perbug-Qt.app/Contents/MacOS/Perbug-Qt" --version

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*.zip

  windows:
    name: Windows (x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/build/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        shell: cmd
        env:
          VCPKG_ROOT: C:\vcpkg
        run: |
          cmake -B build --preset vs2022 ^
            -DBUILD_GUI=ON ^
            -DENABLE_WALLET=ON ^
            -DBUILD_TESTS=OFF ^
            -DBUILD_TX=ON ^
            -DBUILD_UTIL=ON ^
            -DBUILD_WALLET_TOOL=ON ^
            -DENABLE_IPC=OFF

      - name: Save vcpkg cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/build/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Build
        shell: cmd
        env:
          VCPKG_ROOT: C:\vcpkg
        run: cmake --build build --config Release -j 4

      - name: Package
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME:-dev}"
          OUT="perbug-qt-${VER}-windows-x64"
          mkdir -p "dist/$OUT"
          find build -name "perbug*.exe" -type f -exec cp {} "dist/$OUT/" \; 2>/dev/null || true
          find build -name "*.dll" -path "*Release*" -exec cp {} "dist/$OUT/" \; 2>/dev/null || true
          # A Qt app needs its platform plugin in platforms/ or it refuses to
          # start ("no Qt platform plugin could be initialized"). Copying the
          # loose DLLs is not enough; windeployqt lays out the plugin tree.
          WDQ=$(find build/vcpkg_installed -name 'windeployqt.exe' | head -1)
          if [ -n "$WDQ" ]; then
            "$WDQ" --release --no-translations --dir "dist/$OUT" "dist/$OUT/perbug-qt.exe" || true
          fi
          if [ ! -f "dist/$OUT/platforms/qwindows.dll" ]; then
            PLUG=$(find build/vcpkg_installed -type d -name platforms -path '*plugins*' | head -1)
            if [ -n "$PLUG" ]; then
              mkdir -p "dist/$OUT/platforms"
              cp "$PLUG"/qwindows*.dll "dist/$OUT/platforms/" 2>/dev/null || true
            fi
          fi
          test -f "dist/$OUT/platforms/qwindows.dll" || {
            echo "MISSING Qt platform plugin - the GUI would not launch"; exit 1; }
          cp COPYING README.md "dist/$OUT/" 2>/dev/null || true
          ls -la "dist/$OUT"
          # A silent partial build must not ship as a release archive.
          for b in perbug perbug-qt perbugd perbug-cli perbug-tx perbug-util perbug-wallet; do
            ls "dist/$OUT/$b"* >/dev/null 2>&1 || { echo "MISSING BINARY: $b"; exit 1; }
          done
          cd dist && 7z a "${OUT}.zip" "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.zip

  linux:
    name: Linux (x64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config python3 \
            libevent-dev libboost-dev libsqlite3-dev libzmq3-dev \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libqrencode-dev \
            libgl1-mesa-dev libxkbcommon-x11-dev

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DBUILD_GUI=ON \
            -DENABLE_WALLET=ON \
            -DBUILD_TESTS=OFF \
            -DBUILD_TX=ON \
            -DBUILD_UTIL=ON \
            -DBUILD_WALLET_TOOL=ON \
            -DENABLE_IPC=OFF

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Package
        run: |
          VER="${GITHUB_REF_NAME:-dev}"
          OUT="perbug-qt-${VER}-linux-x64"
          mkdir -p "dist/$OUT"
          for b in perbug perbug-qt perbugd perbug-cli perbug-tx perbug-util perbug-wallet; do
            find build/bin build/src -name "$b" -type f -executable -exec cp {} "dist/$OUT/" \; 2>/dev/null || true
          done
          cp COPYING README.md "dist/$OUT/" 2>/dev/null || true
          ls -la "dist/$OUT"
          # A silent partial build must not ship as a release archive.
          for b in perbug perbug-qt perbugd perbug-cli perbug-tx perbug-util perbug-wallet; do
            ls "dist/$OUT/$b"* >/dev/null 2>&1 || { echo "MISSING BINARY: $b"; exit 1; }
          done
          cd dist && tar czf "${OUT}.tar.gz" "$OUT"

      - name: Smoke test
        run: |
          VER="${GITHUB_REF_NAME:-dev}"
          OUT="dist/perbug-qt-${VER}-linux-x64"
          "$OUT/perbugd" --version
          "$OUT/perbug-cli" --version
          QT_QPA_PLATFORM=offscreen "$OUT/perbug-qt" --version

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/*.tar.gz

  release:
    name: Publish release
    needs: [macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Checksums
        run: |
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec mv {} . \;
          sha256sum perbug-qt-* > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            perbug-qt-*
            SHA256SUMS
          body: |
            Perbug Qt wallet — ${{ github.ref_name }}

            | platform | file |
            |---|---|
            | macOS, Apple Silicon | `perbug-qt-${{ github.ref_name }}-macos-arm64.zip` |
            | Windows x64 | `perbug-qt-${{ github.ref_name }}-windows-x64.zip` |
            | Linux x64 | `perbug-qt-${{ github.ref_name }}-linux-x64.tar.gz` |

            Verify with `SHA256SUMS` before running anything:

            - macOS — `shasum -a 256 -c SHA256SUMS --ignore-missing`
            - Linux — `sha256sum -c SHA256SUMS --ignore-missing`
            - Windows — `Get-FileHash .\<file> -Algorithm SHA256`

            ### macOS: "Perbug Core is damaged and can't be opened"

            Nothing is wrong with the download. These builds are signed ad-hoc
            and are **not notarised**, so macOS quarantines them and reports it
            with that wording. Right-click → Open does **not** clear it. Remove
            the quarantine flag:

            ```
            xattr -dr com.apple.quarantine /Applications/Perbug-Qt.app
            ```

            The command-line tools need the same treatment, e.g.
            `xattr -dr com.apple.quarantine ./perbugd`.

            macOS builds are **Apple Silicon only** — there is no Intel build.
            On Windows, SmartScreen will warn on first run: choose "More info",
            then "Run anyway".
